<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Observatorio Judicial Cannábico</title>
    <meta name="description" content="Fiscalización ciudadana de la aplicación de la Ley N° 20.000 en Chile. Cruza cinco fuentes oficiales para auditar la discrecionalidad judicial." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Observatorio Judicial Cannábico" />
    <meta property="og:description" content="Fiscalización ciudadana de la aplicación de la Ley N° 20.000 en Chile." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Observatorio Judicial Cannábico — Plataforma cívica de datos abiertos" />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Observatorio Judicial Cannábico" />
    <meta name="twitter:description" content="Fiscalización ciudadana de la aplicación de la Ley N° 20.000 en Chile." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Tema por ruta aplicado ANTES del primer paint (sin FOUC):
      //   "/mapa" → light (basemap Carto claro)
      //   cualquier otra ruta, incluida "/" → dark
      // Debe coincidir con themeForPath() en src/routes.ts, que sincroniza en
      // cada navegación client-side.
      (function () {
        try {
          var p = window.location.pathname;
          var theme = p === '/mapa' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) { /* fallback al default HTML (dark) */ }
      })();
    </script>

    <!-- Acorta el camino crítico: TCP+TLS al backend y al CDN del basemap se
         abren mientras Vite aún parsea main.tsx. -->
    <link rel="preconnect" href="https://ojcanna.onrender.com" crossorigin />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />

    <!-- Pre-fetch de filtros: el provider los pide siempre, en cualquier ruta. -->
    <link rel="preload" as="fetch" href="/api/v1/cead/filtros" crossorigin />

    <!-- Las geometrías (GeoJSON de 344 comunas) SOLO se precargan en /mapa.
         Desde que la portada reemplazó al mapa en "/", precargarlas siempre
         significaba descargar un payload pesado que la mayoría de las visitas
         nunca usa — el propio navegador lo advertía como preload sin uso. -->
    <script>
      (function () {
        try {
          if (window.location.pathname !== '/mapa') return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'fetch';
          l.href = '/api/v1/cead/geometrias';
          l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        } catch (_) { /* el fetch normal del provider lo cubre igual */ }
      })();
    </script>

    <!-- CalSans solo se usa en el título decorativo del SplashScreen, no en el
         mapa. Prioridad baja: no debe competir por ancho de banda con los
         fetches críticos de CEAD (filtros/geometrías) de arriba. -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/CalSans-Regular.ttf" crossorigin fetchpriority="low" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
