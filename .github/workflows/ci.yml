# Runs the checks declared in AGENTS.md §Verification before anything reaches main.
#
# Vercel (frontend) and Render (backend) both deploy main on push, so this
# workflow is the only gate between a change and production. It only gates if
# main is protected and these jobs are marked as required status checks.
#
# The ETL tests are offline: they run against fixtures and need no database,
# no source credentials and no Playwright browsers.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: ETL tests
        run: python -m pytest tests/etl -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # tsconfig.json has "files": [] and only project references, so a plain
      # `tsc --noEmit` checks nothing. Build mode follows the references.
      - name: Typecheck
        run: npm exec --offline -- tsc -b
      - name: Build
        run: npm run build
