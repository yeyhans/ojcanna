# Keeps the Render free-tier API awake.
#
# The observatory backend sleeps after ~15 minutes of inactivity. The first
# visitor after a spin-down pays a cold start long enough that the homepage KPIs
# and the CEAD map render empty. Pinging the health endpoint on a shorter cycle
# than the idle timeout removes the cold start entirely.
#
# Caveats, on purpose in the open:
#   - GitHub schedules are best-effort and can be delayed under load.
#   - GitHub disables scheduled workflows after 60 days without repository
#     activity. If the KPIs start showing dashes again, check this workflow is
#     still enabled before debugging the frontend.
#   - This is a workaround for the free tier, not a substitute for a paid plan
#     if uptime becomes a real requirement.

name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            https://ojcanna.onrender.com/health)
          echo "health -> $code"
          test "$code" = "200"
